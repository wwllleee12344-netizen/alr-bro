workflows:
  build-bple-dmg:
    name: Build BPLE macOS DMG
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Install create-dmg
        script: |
          brew install create-dmg

      - name: Download App and Prepare Assets
        script: |
          # Download MacOS_BPLE.zip from your Discord link
          curl -f -L -o "MacOS_BPLE.zip" "https://cdn.discordapp.com/attachments/1462108705410519162/1573377358273056881/MacOS_BPLE.zip?ex=6b03c39a&is=6b02721a&hm=efe553313993483fdf05f9812f7d1c6fb540c257d507f7e61eba54ca3fe0f03c&"
          
          # Unzip your macOS app
          unzip -q "MacOS_BPLE.zip" -d ./app_extracted
          
          # Locate "BPLE 2022.1-4 MacOS.app" and copy it cleanly
          APP_PATH=$(find ./app_extracted -name "*.app" -maxdepth 2 | head -n 1)
          mkdir -p ./dmg_source
          cp -R "$APP_PATH" ./dmg_source/

          # Restore macOS executable permissions
          chmod +x ./dmg_source/*.app/Contents/MacOS/*

          # Convert "BPLE disk dmg.png" to icon.icns
          mkdir -p icon.iconset
          sips -z 16 16     "BPLE disk dmg.png" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "BPLE disk dmg.png" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "BPLE disk dmg.png" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "BPLE disk dmg.png" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "BPLE disk dmg.png" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "BPLE disk dmg.png" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "BPLE disk dmg.png" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "BPLE disk dmg.png" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "BPLE disk dmg.png" --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 "BPLE disk dmg.png" --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset

          # Keep exact 660x400 size and set 72 DPI metadata
          cp "Innovation_Background_IL2CPP_Recomp_Empty_Background.png" "bg_final.png"
          sips -s dpiWidth 72 -s dpiHeight 72 "bg_final.png"

      - name: Package BPLE.dmg
        script: |
          mkdir -p output
          APP_FULL_PATH=$(find ./dmg_source -name "*.app" -maxdepth 1 | head -n 1)
          APP_NAME=$(basename "$APP_FULL_PATH")

          # Wake Finder so AppleScript styling doesn't time out on CI
          open -a Finder
          sleep 2

          create-dmg \
            --volname "BPLE" \
            --volicon "icon.icns" \
            --background "bg_final.png" \
            --window-pos 200 120 \
            --window-size 660 440 \
            --icon-size 100 \
            --icon "$APP_NAME" 180 245 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 480 245 \
            --no-internet-enable \
            "output/BPLE.dmg" \
            "./dmg_source/"

          # Apply custom icon to the BPLE.dmg file itself
          sips -i "BPLE disk dmg.png"
          DeRez -only icns "BPLE disk dmg.png" > tmpicns.rsrc
          Rez -append tmpicns.rsrc -o "output/BPLE.dmg"
          SetFile -a C "output/BPLE.dmg"

    artifacts:
      - output/*.dmg
